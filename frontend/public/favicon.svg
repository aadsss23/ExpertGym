<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Latar Belakang (Deep Black: #080808) -->
  <rect width="512" height="512" rx="112" fill="#080808"/>
  
  <!-- Rotasi 45 derajat untuk kesan dinamis dan sporty -->
  <g transform="rotate(-45 256 256)">
    <!-- Gagang Barbell (Off-white: #F5F1E8) -->
    <rect x="72" y="240" width="368" height="32" fill="#F5F1E8" rx="16"/>
    
    <!-- Pengunci Beban / Collar (Off-white: #F5F1E8) -->
    <rect x="180" y="224" width="16" height="64" fill="#F5F1E8" rx="4"/>
    <rect x="316" y="224" width="16" height="64" fill="#F5F1E8" rx="4"/>

    <!-- Plat Beban Utama (Bright Lime Yellow: #DFFF00) -->
    <rect x="136" y="144" width="36" height="224" fill="#DFFF00" rx="12"/>
    <rect x="340" y="144" width="36" height="224" fill="#DFFF00" rx="12"/>
    
    <!-- Plat Beban Luar (Bright Lime Yellow: #DFFF00) -->
    <rect x="92" y="176" width="28" height="160" fill="#DFFF00" rx="10"/>
    <rect x="392" y="176" width="28" height="160" fill="#DFFF00" rx="10"/>
  </g>
</svg>
